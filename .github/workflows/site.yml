# Publishes web/ to GitHub Pages (benchie.world).
# Every push to main deploys. Every Monday 07:04 Helsinki it first draws the Bench of the week card from live data
# into web/week, commits it, deploys, then posts it to Instagram when IG_USER_ID / IG_ACCESS_TOKEN exist.
# Until the very first card exists, an hourly run also tries, so the card appears within the hour of the first check-in
# or rating anywhere near Helsinki (the homepage hides the section while there is no card). After that, hourly runs do nothing.
name: site
on:
  push:
    branches: [main]
  schedule:
    - cron: '4 4 * * 1'    # weekly card: 04:04 UTC = 07:04 Helsinki in summer, 06:04 in winter
    - cron: '23 * * * *'   # hourly: only while there is no card yet
  workflow_dispatch:
    inputs:
      card: { description: 'Draw a new Bench of the week card first', type: boolean, default: false }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    env:
      HAVE_IG: ${{ secrets.IG_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
      - id: want
        run: |
          if [ "${{ github.event.schedule }}" = "4 4 * * 1" ] || [ "${{ inputs.card }}" = "true" ]; then draw=true
          elif [ "${{ github.event_name }}" = "schedule" ] && [ ! -f web/week/latest.png ]; then draw=true
          else draw=false; fi
          echo "draw=$draw" >> $GITHUB_OUTPUT
          echo "CARD=$draw" >> $GITHUB_ENV
      - if: ${{ env.CARD == 'true' }}
        uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - id: card
        if: ${{ env.CARD == 'true' }}
        env:
          SUPABASE_URL: https://ieqboitlwanqfzdougua.supabase.co
          SUPABASE_KEY: sb_publishable_K04-qfLpAW6-BMaWowpWOA_7JDk0w8S
        run: |
          pip install pillow cairosvg
          out=$(python3 tools/weekly/card.py --lat 60.17 --lng 24.94 --km 25 --out web/week)
          echo "$out"
          echo "caption=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("caption",""))')" >> $GITHUB_OUTPUT
          echo "bench=$(echo "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("bench") or "")')" >> $GITHUB_OUTPUT
      - if: ${{ steps.card.outputs.bench != '' }}
        run: |
          git config user.name "benchie-bot"
          git config user.email "bot@benchie.world"
          git add web/week
          git diff --cached --quiet || git commit -m "Bench of the week: ${{ steps.card.outputs.bench }}"
          git push
      - if: ${{ github.event.schedule != '23 * * * *' || steps.card.outputs.bench != '' }}
        uses: actions/configure-pages@v5
      - if: ${{ github.event.schedule != '23 * * * *' || steps.card.outputs.bench != '' }}
        uses: actions/upload-pages-artifact@v4
        with: { path: web }
      - id: deployment
        if: ${{ github.event.schedule != '23 * * * *' || steps.card.outputs.bench != '' }}
        uses: actions/deploy-pages@v4
      - name: Instagram
        if: ${{ env.HAVE_IG == 'true' && steps.card.outputs.bench != '' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          sleep 60
          python3 tools/weekly/post_instagram.py "https://benchie.world/week/latest.png" "${{ steps.card.outputs.caption }} #benchie #bench #helsinki"
